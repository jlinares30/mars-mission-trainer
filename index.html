<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Survival Mars</title>
  <meta name="theme-color" content="#120a08">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Entrenador de Misiones para Astronautas Junior — NASA Space Apps Challenge 2026">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="mundo"></div>

  <header class="hud-top">
    <div class="tablero">
      <div class="mision" id="sol"></div>
      <div class="recursos" id="recursos"></div>
    </div>
  </header>

  <nav class="botones-top">
    <button id="btnTarea" class="tarea-btn" data-i18n-title="top.tarea.t" title="Lo que pide hoy Control de Misión"></button>
    <button id="btnInventario" class="chip-btn" data-i18n-title="top.inventario.t" data-i18n-aria="top.inventario.t" title="Lo que recolectaste en Marte" aria-label="Lo que recolectaste en Marte">🎒</button>
    <button id="btnDatos" class="chip-btn nasa" data-i18n-title="top.nasa.t" title="¿Qué es real en este juego?" data-i18n="top.nasa">📡 Datos</button>
    <button id="btnIdioma" class="chip-btn" title="Change language to English" aria-label="Change language to English"><span class="idioma-icono" aria-hidden="true">🌐</span><span class="idioma-codigo" aria-hidden="true">EN</span></button>
    <button id="btnAyudaTuto" class="chip-btn" data-i18n-title="top.tuto.t" title="Ver el tutorial otra vez" aria-label="Tutorial">❓</button>
    <button id="btnLigero" class="chip-btn" data-i18n-title="top.ligero" title="Gráficos ligeros (para computadoras lentas)">🐢</button>
    <button id="btnSonido" class="chip-btn" data-i18n-title="top.sonido.t" data-i18n-aria="top.sonido.t" title="Sonido" aria-label="Sonido">🔊</button>
  </nav>

  <div class="tags" id="tags"></div>

  <aside class="panel" id="panel"></aside>

  <section class="bitacora" id="bitacoraBox">
    <button class="bit-tit" id="btnLog">📓<span class="btn-txt" data-i18n="top.bitacora"> Bitácora</span></button>
    <ul id="bitacora"></ul>
  </section>

  <footer class="hud-bottom">
    <button class="btn-base" id="btnBase" data-i18n="top.base">🖥️ Control base</button>
    <div class="energia" id="energia"></div>
    <button class="btn-sol" id="btnSol" data-i18n-html="top.terminar">Terminar<span class="btn-txt-m"> el</span> Sol 🌙</button>
  </footer>

  <div id="modal" class="modal oculto"><div class="modal-caja" id="modalCaja"></div></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
